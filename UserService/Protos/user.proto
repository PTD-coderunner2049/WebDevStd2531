syntax = "proto3";

option csharp_namespace = "UserService.Contracts";

package useraccount;

service UserAccount {
  rpc RegisterUser (RegisterUserRequest) returns (UserAuthReply);
  rpc LoginUser (LoginUserRequest) returns (UserAuthReply);
  rpc StreamUsers (StreamUsersRequest) returns (stream UserProfile);
}

message RegisterUserRequest {
  string email = 1;
  string user_name = 2;
  string password = 3;
  string full_name = 4;
  string date_of_birth = 5;
  string address = 6;
  string gender = 7;
  bool is_admin = 8;
}

message LoginUserRequest {
  string user_name = 1;
  string password = 2;
}

message StreamUsersRequest {
  string role_filter = 1;
}

message UserProfile {
  string user_id = 1;
  string user_name = 2;
  string email = 3;
  string full_name = 4;
  string date_of_birth = 5;
  string address = 6;
  string gender = 7;
  repeated string roles = 8;
  bool is_admin = 9;
}

message UserAuthReply {
  bool success = 1;
  string message = 2;
  string token = 3;
  string user_id = 4;
  string user_name = 5;
  string email = 6;
  repeated string roles = 7;
  bool is_admin = 8;
}
