syntax = "proto3";

option csharp_namespace = "OrderService.Protos.Catalog";

package catalog;

service Catalog {
  rpc GetProductDetail (ProductRequest) returns (ProductDetailReply);
  rpc AdjustStock (AdjustStockRequest) returns (AdjustStockReply);
}

message ProductRequest {
  int32 id = 1;
}

message ProductOptionDto {
  int32 id = 1;
  string value = 2;
}

message ProductSummary {
  int32 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
  double discount = 6;
  double tax = 7;
  string image_url = 8;
  int32 category_id = 9;
  string category_name = 10;
  repeated ProductOptionDto available_options = 11;
}

message ProductDetailReply {
  ProductSummary product = 1;
  repeated ProductSummary related_products = 2;
}

message AdjustStockRequest {
  int32 product_id = 1;
  int32 quantity_delta = 2;
}

message AdjustStockReply {
  bool success = 1;
  string message = 2;
  int32 new_stock = 3;
}
